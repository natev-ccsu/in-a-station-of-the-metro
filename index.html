<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In a Station of the Metro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <article class="panel">
        <div class="image-wrap">
          <figure class="photo-frame">
            <img src="images/Haiku_image.png" alt="Rainy metro station platform" />
            <span class="live-preview">Live Preview</span>
          </figure>
        </div>

        <div class="poem">
          <p class="credit"><em>by Ezra Pound</em></p>
          <p>The apparition of these faces in the crowd;</p>
          <p>Petals on a wet, black bough.</p>
        </div>
      </article>
    </div>
  </body>
</html>
